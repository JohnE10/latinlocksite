name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Added: upgrade to v5 for Node 24-compatible action runtime.
        uses: actions/checkout@v5

      - name: Setup Node.js
        # Added: upgrade to v5 for Node 24-compatible action runtime.
        uses: actions/setup-node@v5
        with:
          # Added: align CI runtime with package.json engines field.
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Added: use npm install to avoid hard-failing on lockfile drift while CI is being stabilized.
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build